<div class="dropdown">
  <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" id="version-switcher" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Select version">
    {{ current_version }}
  </button>
  <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="version-switcher">
    {% for version in all_versions %}
    <li>
      <a class="dropdown-item{% if version == current_version %} active{% endif %}" href="{{ urls[version][current_language] }}">
        {{ version }} ({{ version_labels.get(version, "stable") }}{% if version == default_version %}, latest{% endif %})
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
